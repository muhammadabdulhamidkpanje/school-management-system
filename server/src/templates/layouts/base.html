<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; }
    .header { background: #1a73e8; padding: 30px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 24px; }
    .body { padding: 40px 30px; color: #333; line-height: 1.6; }
    .btn { display: inline-block; padding: 14px 32px; background: #1a73e8;
           color: #fff; text-decoration: none; border-radius: 6px;
           font-weight: bold; margin: 20px 0; }
    .footer { background: #f9f9f9; padding: 20px; text-align: center;
              font-size: 12px; color: #999; border-top: 1px solid #eee; }
    .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    .warning { background: #fff8e1; border-left: 4px solid #f9a825;
               padding: 12px 16px; margin: 20px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{appName}}</h1>
    </div>
    <div class="body">
      {{{content}}}
    </div>
    <div class="footer">
      <p>© {{year}} {{appName}}. All rights reserved.</p>
      <p>If you did not request this email, please ignore it.</p>
    </div>
  </div>
</body>
</html>
